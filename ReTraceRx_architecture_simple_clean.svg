<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <filter id="s2" x="-8%" y="-8%" width="116%" height="132%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="880" height="600" fill="#ffffff"/>

  <text x="28" y="34" font-size="20" font-weight="800" fill="#0f172a">ReTraceRx — agent &amp; tools</text>
  <text x="28" y="55" font-size="12" fill="#64748b">Agent orchestrates retrieval tools over the graph, then every citation is enum-constrained and verified.</text>

  <!-- query -->
  <g filter="url(#s2)"><rect x="24" y="120" width="140" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/></g>
  <text x="94" y="147" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Disease query</text>

  <!-- agent -->
  <g filter="url(#s2)"><rect x="190" y="104" width="300" height="86" rx="9" fill="#fff" stroke="#c2410c" stroke-width="1.8"/></g>
  <text x="340" y="130" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Agent (LangGraph)</text>
  <text x="340" y="149" font-size="11" fill="#475569" text-anchor="middle">reasoner: Qwen3.5-9B · vLLM</text>
  <text x="340" y="167" font-size="11" font-style="italic" fill="#9a3412" text-anchor="middle">link → retrieve → reason → verify → assemble</text>
  <line x1="164" y1="142" x2="188" y2="142" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- tools -->
  <g filter="url(#s2)"><rect x="540" y="66" width="316" height="150" rx="9" fill="#fff" stroke="#0e7490" stroke-width="1.6"/></g>
  <text x="556" y="90" font-size="13" font-weight="700" fill="#0f172a">Tools</text>
  <text x="556" y="114" font-size="11" fill="#334155">• Entity linker — SapBERT/FAISS (disease → node)</text>
  <text x="556" y="138" font-size="11" fill="#334155">• KG path-finder — 2-hop metapath (Neo4j Cypher)</text>
  <text x="556" y="162" font-size="11" fill="#334155">• KGE scorer — per-split RotatE / PyKEEN</text>
  <text x="568" y="178" font-size="10" font-style="italic" fill="#0e7490">score_pair · 560 hubs blacklisted</text>

  <!-- graph -->
  <g filter="url(#s2)"><rect x="540" y="240" width="316" height="82" rx="9" fill="#fff" stroke="#4338ca" stroke-width="1.6"/></g>
  <text x="698" y="266" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">OptimusKG (Neo4j)</text>
  <text x="698" y="285" font-size="11" fill="#475569" text-anchor="middle">leakage-filtered graph · APOC</text>
  <text x="698" y="301" font-size="11" fill="#475569" text-anchor="middle">candidate whitelist: 1,565 reachable</text>

  <!-- agent -> tools -->
  <line x1="490" y1="132" x2="538" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="514" y="123" font-size="9.5" font-style="italic" fill="#475569" text-anchor="middle">calls</text>
  <!-- tools -> graph -->
  <line x1="698" y1="216" x2="698" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="710" y="232" font-size="9.5" font-style="italic" fill="#475569">graph queries</text>
  <!-- graph -> agent (return loop) -->
  <path d="M540,278 L516,278 L516,168 L492,168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="524" y="230" font-size="9.5" font-style="italic" fill="#475569" transform="rotate(-90 524 230)">evidence paths · scores · citations</text>

  <!-- faithfulness (highlight) -->
  <g filter="url(#s2)"><rect x="170" y="300" width="340" height="86" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/></g>
  <text x="340" y="326" font-size="13" font-weight="800" fill="#9a3412" text-anchor="middle">Faithfulness</text>
  <text x="340" y="346" font-size="11" fill="#7c2d12" text-anchor="middle">citations enum-constrained:  cited_path_ids ⊆ retrieved</text>
  <text x="340" y="365" font-size="11" fill="#7c2d12" text-anchor="middle">verifier re-checks each cited path exists in the graph</text>
  <text x="340" y="380" font-size="9.5" font-style="italic" fill="#9a3412" text-anchor="middle">fabrication impossible at decode time; verifier = defence-in-depth</text>
  <line x1="340" y1="190" x2="340" y2="298" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- output -->
  <g filter="url(#s2)"><rect x="120" y="430" width="440" height="70" rx="9" fill="#fff" stroke="#6d28d9" stroke-width="1.6"/></g>
  <text x="340" y="459" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Ranked candidates + mechanistic evidence paths</text>
  <text x="340" y="479" font-size="11.5" fill="#475569" text-anchor="middle">+ faithfulness / calibrated abstention</text>
  <line x1="340" y1="386" x2="340" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- eval -->
  <g filter="url(#s2)"><rect x="600" y="432" width="256" height="70" rx="9" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/></g>
  <text x="728" y="461" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Evaluated vs repoDB gold set</text>
  <text x="728" y="481" font-size="11" fill="#475569" text-anchor="middle">Brown &amp; Patel 2017 · 8,390 pos / 2,212 neg</text>
  <line x1="560" y1="465" x2="598" y2="465" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
</svg>
